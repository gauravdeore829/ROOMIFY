version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: roomease_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: roomease
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: roomease_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/roomease?schema=public"
      PORT: 5000
      JWT_SECRET: "roomease_super_secret_jwt_key_2026"
      AI_SERVICE_URL: "http://ai-service:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    container_name: roomease_ai
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

volumes:
  postgres_data:
